<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weakly Prime-Additive Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --paper: #F7F5F0;
  --ink: #1A1814;
  --ink2: #5C5850;
  --ink3: #A8A39A;
  --line: #E0DDD6;
  --line2: #CCC9C0;
  --blue: #2C5F8A;
  --green: #2A6B4A;
  --mono: 'DM Mono', monospace;
  --sans: 'DM Sans', sans-serif;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

.wrap { max-width: 1080px; margin: 0 auto; padding: 3rem 2rem 6rem; }

.site-header { border-bottom: 1.5px solid var(--ink); padding-bottom: 1.5rem; margin-bottom: 3rem; }
.site-title { font-family: var(--mono); font-size: 13px; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink3); }
h1 { font-family: var(--sans); font-size: clamp(22px, 3vw, 32px); font-weight: 300; letter-spacing: -0.02em; color: var(--ink); margin-top: 6px; line-height: 1.2; }
.formula { font-family: var(--mono); font-size: 12px; color: var(--ink2); margin-top: 8px; letter-spacing: 0.02em; }
.section-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink3); margin-bottom: 12px; }

.config { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line2); margin-bottom: 2rem; }
.config-cell { background: var(--paper); padding: 16px 18px; }
.config-cell label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink3); margin-bottom: 8px; }
.config-cell input[type=number], .config-cell select { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--line2); padding: 4px 0; font-family: var(--mono); font-size: 15px; color: var(--ink); outline: none; appearance: none; -webkit-appearance: none; }
.config-cell input[type=number]:focus, .config-cell select:focus { border-bottom-color: var(--ink); }

.toggle-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
.tog { position: relative; width: 36px; height: 20px; border: 1px solid var(--line2); border-radius: 10px; background: transparent; cursor: pointer; transition: background 0.2s, border-color 0.2s; flex-shrink: 0; }
.tog.on { background: var(--ink); border-color: var(--ink); }
.tog::after { content: ''; position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--line2); top: 3px; left: 3px; transition: left 0.2s, background 0.2s; }
.tog.on::after { left: 19px; background: var(--paper); }
.tog-label { font-family: var(--mono); font-size: 12px; color: var(--ink2); }

.run-btn { width: 100%; padding: 12px; background: var(--ink); border: none; color: var(--paper); font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: opacity 0.15s; margin-top: 12px; }
.run-btn:hover { opacity: 0.8; }
.run-btn:active { opacity: 0.6; }
.run-btn.running { opacity: 0.4; pointer-events: none; }

.progress-wrap { height: 1px; background: var(--line); margin-bottom: 2rem; display: none; overflow: hidden; }
.progress-bar { height: 100%; background: var(--ink); width: 0%; transition: width 0.1s; }

.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line2); margin-bottom: 2rem; }
.stat-box { background: var(--paper); padding: 20px 18px; text-align: center; }
.stat-num { font-family: var(--mono); font-size: 28px; font-weight: 300; color: var(--ink); letter-spacing: -0.02em; line-height: 1; }
.stat-lbl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink3); margin-top: 6px; }

.tab-nav { display: flex; border-bottom: 1px solid var(--line2); margin-bottom: 2rem; }
.tab-btn { padding: 10px 20px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; background: none; border: none; border-bottom: 2px solid transparent; color: var(--ink3); cursor: pointer; margin-bottom: -1px; transition: color 0.15s, border-color 0.15s; }
.tab-btn:hover { color: var(--ink2); }
.tab-btn.active { color: var(--ink); border-bottom-color: var(--ink); }

.filter-bar { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.filter-bar label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3); }
.filter-bar input { width: 72px; background: transparent; border: none; border-bottom: 1px solid var(--line2); padding: 2px 0; font-family: var(--mono); font-size: 13px; color: var(--ink); outline: none; }
.filter-bar input:focus { border-bottom-color: var(--ink); }
.csv-btn { margin-left: auto; padding: 5px 14px; background: transparent; border: 1px solid var(--line2); font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink2); cursor: pointer; transition: border-color 0.15s, color 0.15s; }
.csv-btn:hover { border-color: var(--ink); color: var(--ink); }

.tbl-wrap { overflow-x: auto; max-height: 440px; overflow-y: auto; border: 1px solid var(--line2); }
table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; }
thead th { background: var(--paper); position: sticky; top: 0; z-index: 2; padding: 10px 14px; text-align: left; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink3); font-weight: 400; border-bottom: 1px solid var(--line2); white-space: nowrap; }
tbody td { padding: 9px 14px; border-bottom: 1px solid var(--line); color: var(--ink2); white-space: nowrap; vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: rgba(0,0,0,0.02); }
td.n-col { color: var(--ink); font-weight: 500; }
td.sigma-col { color: var(--blue); }

.pill { display: inline-block; padding: 2px 9px; border-radius: 2px; font-size: 11.5px; }
.pill-mult { background: rgba(44,95,138,0.08); color: var(--blue); }
.pill-add { background: rgba(42,107,74,0.08); color: var(--green); }

.tbl-foot { padding: 8px 14px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--ink3); border: 1px solid var(--line2); border-top: none; }
.empty-row { padding: 3rem; text-align: center; font-family: var(--mono); font-size: 12px; color: var(--ink3); letter-spacing: 0.08em; }

.insight-grid { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line2); }
.i-card { background: var(--paper); padding: 20px 22px; }
.i-card-title { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink3); margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 3px 10px; font-family: var(--mono); font-size: 11px; border: 1px solid var(--line2); color: var(--ink2); background: transparent; }
.p-table { width: 100%; border-collapse: collapse; }
.p-table td { padding: 5px 0; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 12px; color: var(--ink2); }
.p-table tr:last-child td { border-bottom: none; }
.bar { display: inline-block; height: 4px; background: var(--ink3); border-radius: 1px; vertical-align: middle; margin-left: 8px; opacity: 0.5; }
.i-scroll { max-height: 220px; overflow-y: auto; }
.sig { font-family: Georgia, serif; font-style: italic; }
.empty-insight { padding: 3rem; text-align: center; font-family: var(--mono); font-size: 12px; color: var(--ink3); letter-spacing: 0.08em; border: 1px solid var(--line2); }
</style>
</head>
<body>
<div class="wrap">

  <header class="site-header">
    <p class="site-title">Number Theory · Research Tool</p>
    <h1>Weakly Prime-Additive Explorer</h1>
    <p class="formula">n = p₁<sup>a₁</sup> · p₂<sup>a₂</sup> · p₃<sup>a₃</sup> = p₁<sup>s₁</sup> + p₂<sup>s₂</sup> + p₃<sup>s₃</sup></p>
  </header>

  <p class="section-label">Parameters</p>
  <div class="config">
    <div class="config-cell">
      <label>Search limit</label>
      <input type="number" id="searchLimit" value="100000" min="100" max="5000000" step="1000">
    </div>
    <div class="config-cell">
      <label>Prime factors</label>
      <select id="numFactors">
        <option value="2">2 ตัว</option>
        <option value="3" selected>3 ตัว</option>
        <option value="4">4 ตัว</option>
        <option value="5">4 ตัวขึ้นไป</option>
      </select>
    </div>
    <div class="config-cell">
      <label>Filter first term</label>
      <div class="toggle-row">
        <button class="tog on" id="reqToggle" onclick="toggleReq()"></button>
        <span class="tog-label" id="reqLabel">ต้องเป็น 2 หรือ 3</span>
      </div>
    </div>
    <div class="config-cell" style="display:flex;flex-direction:column;justify-content:flex-end">
      <button class="run-btn" id="runBtn" onclick="runSearch()">Run Search</button>
    </div>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="stats-row">
    <div class="stat-box"><div class="stat-num" id="statCount">—</div><div class="stat-lbl">Found</div></div>
    <div class="stat-box"><div class="stat-num" id="statMin">—</div><div class="stat-lbl">Minimum</div></div>
    <div class="stat-box"><div class="stat-num" id="statMax">—</div><div class="stat-lbl">Maximum</div></div>
  </div>

  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('table',this)">Table</button>
    <button class="tab-btn" onclick="switchTab('insight',this)">Observations</button>
  </div>

  <div id="tab-table">
    <div class="filter-bar">
      <label>n ≥</label><input type="number" id="fMin" placeholder="—" oninput="filterTable()">
      <label>n ≤</label><input type="number" id="fMax" placeholder="—" oninput="filterTable()">
      <label><span class="sig">σ</span>(n) ≥</label><input type="number" id="fSMin" placeholder="—" oninput="filterTable()">
      <button class="csv-btn" onclick="downloadCSV()">↓ Export CSV</button>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>n</th>
          <th><span class="sig">σ</span>(n)</th>
          <th>Multiplicative form</th>
          <th>Additive form</th>
          <th>Primes</th>
        </tr></thead>
        <tbody id="tableBody"><tr><td colspan="5" class="empty-row">Run search to display results</td></tr></tbody>
      </table>
    </div>
    <div class="tbl-foot" id="tableCount"></div>
  </div>

  <div id="tab-insight" style="display:none">
    <div id="insightContent" class="empty-insight">Run search to view observations</div>
  </div>

</div>
<script>
let results=[], filtered=[], reqBase=true;

function toggleReq(){
  reqBase=!reqBase;
  document.getElementById('reqToggle').classList.toggle('on',reqBase);
  document.getElementById('reqLabel').textContent=reqBase?'ต้องเป็น 2 หรือ 3':'ไม่จำกัด';
}

function getPrimeFactors(n){
  const f={};let d=2,t=n;
  while(d*d<=t){while(t%d===0){f[d]=(f[d]||0)+1;t=Math.floor(t/d);}d++;}
  if(t>1)f[t]=(f[t]||0)+1;
  return Object.entries(f).map(([p,e])=>[+p,e]).sort((a,b)=>a[0]-b[0]);
}

function sigma(n){
  let s=0;
  for(let i=1;i*i<=n;i++){if(n%i===0){s+=i;if(i*i!==n)s+=Math.floor(n/i);}}
  return s;
}

function solveAdditive(target,primes){
  if(target===0&&primes.length===0)return[];
  if(target<0||primes.length===0)return null;
  const p=primes[0],rest=primes.slice(1);
  let val=p,exp=1;
  while(val<=target){const r=solveAdditive(target-val,rest);if(r!==null)return[[p,exp],...r];val*=p;exp++;}
  return null;
}

function fmt(tuples,sep){return tuples.map(([p,e])=>`${p}<sup>${e}</sup>`).join(sep);}

function runSearch(){
  const limit=Math.min(+document.getElementById('searchLimit').value||100000,5000000);
  const nf=+document.getElementById('numFactors').value;
  const btn=document.getElementById('runBtn');
  btn.textContent='Searching…';btn.classList.add('running');
  document.getElementById('progressWrap').style.display='block';
  results=[];let i=2;
  function chunk(){
    const end=Math.min(i+8000,limit+1);
    for(;i<end;i++){
      const fac=getPrimeFactors(i);
      if(nf===5){if(fac.length<4)continue;}
      else if(nf>0&&fac.length!==nf)continue;
      const primes=fac.map(([p])=>p);
      if(reqBase&&primes[0]!==2&&primes[0]!==3)continue;
      const sol=solveAdditive(i,primes);
      if(sol){const s=sigma(i);results.push({n:i,sigma:s,ratio:s/i,fac,sol,primes});}
    }
    document.getElementById('progressBar').style.width=Math.round((i/limit)*100)+'%';
    if(i<=limit)requestAnimationFrame(chunk);else finalize();
  }
  requestAnimationFrame(chunk);
}

function finalize(){
  const btn=document.getElementById('runBtn');
  btn.textContent='Run Search';btn.classList.remove('running');
  document.getElementById('progressWrap').style.display='none';
  filtered=[...results];updateStats();renderTable(filtered);buildInsights();
}

function updateStats(){
  document.getElementById('statCount').textContent=results.length.toLocaleString();
  if(results.length){
    document.getElementById('statMin').textContent=results[0].n.toLocaleString();
    document.getElementById('statMax').textContent=results[results.length-1].n.toLocaleString();
  }
}

function renderTable(data){
  const tbody=document.getElementById('tableBody');
  if(!data.length){tbody.innerHTML='<tr><td colspan="5" class="empty-row">No results in this range</td></tr>';return;}
  tbody.innerHTML=data.slice(0,500).map(r=>`<tr>
    <td class="n-col">${r.n.toLocaleString()}</td>
    <td class="sigma-col">${r.sigma.toLocaleString()}</td>
    <td><span class="pill pill-mult">${fmt(r.fac,' × ')}</span></td>
    <td><span class="pill pill-add">${fmt(r.sol,' + ')}</span></td>
    <td style="color:var(--ink3)">${r.primes.join(', ')}</td>
  </tr>`).join('');
  document.getElementById('tableCount').textContent=data.length>500?`Showing 500 of ${data.length.toLocaleString()} results`:`${data.length.toLocaleString()} results`;
}

function filterTable(){
  const mn=+document.getElementById('fMin').value||0;
  const mx=+document.getElementById('fMax').value||Infinity;
  const sm=+document.getElementById('fSMin').value||0;
  filtered=results.filter(r=>r.n>=mn&&r.n<=mx&&r.sigma>=sm);
  renderTable(filtered);
}

function buildInsights(){
  const el=document.getElementById('insightContent');
  if(!results.length){el.className='empty-insight';el.textContent='No data';return;}
  el.className='';
  const pf={};
  results.forEach(r=>r.primes.forEach(p=>{pf[p]=(pf[p]||0)+1;}));
  const topP=Object.entries(pf).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const patterns={};
  results.forEach(r=>{const k=r.primes.join('·');patterns[k]=(patterns[k]||0)+1;});
  const topPat=Object.entries(patterns).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxC=topPat[0]?.[1]||1;
  const oddExpMult=results.filter(r=>r.fac.every(([,e])=>e%2===1));
  const oddExpAdd=results.filter(r=>r.sol.every(([,e])=>e%2===1));
  const sigma3OddMult=results.filter(r=>r.sigma%3===0&&r.fac.every(([,e])=>e%2===1));
  function fmtSup(t,s){return t.map(([p,e])=>`${p}<sup>${e}</sup>`).join(s);}

  el.innerHTML=`<div class="insight-grid">
    <div class="i-card">
      <div class="i-card-title">Most frequent primes</div>
      <div class="chips">${topP.map(([p,c])=>`<span class="chip">p = ${p} &nbsp;(${c}×)</span>`).join('')}</div>
    </div>
    <div class="i-card">
      <div class="i-card-title">Most common prime sets</div>
      <table class="p-table">${topPat.map(([k,c])=>`<tr>
        <td>{ ${k} }</td>
        <td style="text-align:right;width:40px;color:var(--ink3)">${c}×</td>
        <td style="width:100px"><span class="bar" style="width:${Math.round(c/maxC*88)}px"></span></td>
      </tr>`).join('')}</table>
    </div>
    <div class="i-card">
      <div class="i-card-title">Multiplicative form — all exponents odd · ${oddExpMult.length} found</div>
      ${oddExpMult.length===0?`<p style="font-family:var(--mono);font-size:12px;color:var(--ink3)">None in search range</p>`:`
      <div class="i-scroll"><table class="p-table">
        <tr><td style="color:var(--ink3);font-size:10px;letter-spacing:.1em;text-transform:uppercase">n</td><td style="color:var(--ink3);font-size:10px;letter-spacing:.1em;text-transform:uppercase">Form</td><td style="color:var(--ink3);font-size:10px;letter-spacing:.1em;text-transform:uppercase">Exp</td></tr>
        ${oddExpMult.map(r=>`<tr>
          <td style="color:var(--ink)">${r.n.toLocaleString()}</td>
          <td><span class="pill pill-mult" style="font-size:11px">${fmtSup(r.fac,' × ')}</span></td>
          <td style="color:var(--ink3)">${r.fac.map(([,e])=>e).join(', ')}</td>
        </tr>`).join('')}
      </table></div>`}
    </div>
    <div class="i-card">
      <div class="i-card-title">Additive form — all exponents odd · ${oddExpAdd.length} found</div>
      ${oddExpAdd.length===0?`<p style="font-family:var(--mono);font-size:12px;color:var(--ink3)">None in search range</p>`:`
      <div class="i-scroll"><table class="p-table">
        <tr><td style="color:var(--ink3);font-size:10px;letter-spacing:.1em;text-transform:uppercase">n</td><td style="color:var(--ink3);font-size:10px;letter-spacing:.1em;text-transform:uppercase">Form</td><td style="color:var(--ink3);font-size:10px;letter-spacing:.1em;text-transform:uppercase">Exp</td></tr>
        ${oddExpAdd.map(r=>`<tr>
          <td style="color:var(--ink)">${r.n.toLocaleString()}</td>
          <td><span class="pill pill-add" style="font-size:11px">${fmtSup(r.sol,' + ')}</span></td>
          <td style="color:var(--ink3)">${r.sol.map(([,e])=>e).join(', ')}</td>
        </tr>`).join('')}
      </table></div>`}
    </div>
    <div class="i-card">
      <div class="i-card-title"><span class="sig">σ</span>(n) ≡ 0 (mod 3) & multiplicative exponents all odd · ${sigma3OddMult.length} found</div>
      ${sigma3OddMult.length===0?`<p style="font-family:var(--mono);font-size:12px;color:var(--ink3)">None in search range</p>`:`
      <div class="i-scroll"><table class="p-table">
        <tr>
          <td style="color:var(--ink3);font-size:10px;letter-spacing:.1em;text-transform:uppercase">n</td>
          <td style="color:var(--ink3);font-size:10px;letter-spacing:.1em;text-transform:uppercase"><span class="sig">σ</span>(n)</td>
          <td style="color:var(--ink3);font-size:10px;letter-spacing:.1em;text-transform:uppercase">Multiplicative</td>
          <td style="color:var(--ink3);font-size:10px;letter-spacing:.1em;text-transform:uppercase">Additive</td>
          <td style="color:var(--ink3);font-size:10px;letter-spacing:.1em;text-transform:uppercase">Exp</td>
        </tr>
        ${sigma3OddMult.map(r=>`<tr>
          <td style="color:var(--ink)">${r.n.toLocaleString()}</td>
          <td style="color:var(--blue)">${r.sigma.toLocaleString()}</td>
          <td><span class="pill pill-mult" style="font-size:11px">${fmtSup(r.fac,' × ')}</span></td>
          <td><span class="pill pill-add" style="font-size:11px">${fmtSup(r.sol,' + ')}</span></td>
          <td style="color:var(--ink3)">${r.fac.map(([,e])=>e).join(', ')}</td>
        </tr>`).join('')}
      </table></div>`}
    </div>
  </div>`;
}

function downloadCSV(){
  if(!filtered.length)return;
  const header=['n','sigma_n','multiplicative_form','additive_form','prime_factors'];
  const rows=filtered.map(r=>[r.n,r.sigma,r.fac.map(([p,e])=>`${p}^${e}`).join(' * '),r.sol.map(([p,e])=>`${p}^${e}`).join(' + '),r.primes.join(';')]);
  const csv=[header,...rows].map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download=`weakly_prime_additive_n${filtered[0].n}-${filtered[filtered.length-1].n}.csv`;
  a.click();
}

function switchTab(name,btn){
  document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  ['table','insight'].forEach(t=>{document.getElementById('tab-'+t).style.display=t===name?'block':'none';});
}
</script>
</body>
</html>
